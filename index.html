<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;

  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:76px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;--shadow:rgba(91,58,41,.08);
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none;}
html,body{
  background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  line-height:1.8;font-size:20px;letter-spacing:.02em;
  scrollbar-width:none;-ms-overflow-style:none;
}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{
  display:none;width:0;height:0;
}
img{-webkit-user-drag:none;pointer-events:none;}

/* ===== Sidebar ===== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:6px;padding:6px 4px;width:100%;align-items:center;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 4px;border-radius:8px;cursor:pointer;
  color:var(--sbText);text-decoration:none;
  transition:background .25s,transform .25s;width:64px;}
.sb-item:hover{background:rgba(184,134,11,.12);}
.sb-circle{width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(212,196,168,.12);border:1px solid rgba(212,196,168,.3);
  font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;
  color:var(--goldL);transition:all .25s;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;
  letter-spacing:1px;text-align:center;line-height:1.3;opacity:.85;}
.sb-item.active .sb-circle{background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;border-color:var(--goldL);
  box-shadow:0 0 12px rgba(184,134,11,.6);transform:scale(1.08);}
.sb-item.active .sb-label{color:var(--goldL);opacity:1;font-weight:600;}

#sbToggle{position:fixed;top:14px;left:14px;z-index:130;
  display:none;width:38px;height:38px;border:0;border-radius:8px;
  background:var(--sbBg);color:var(--gold);cursor:pointer;
  font-size:18px;align-items:center;justify-content:center;}

/* ===== Read progress capsule ===== */
.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;
}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* ===== Main ===== */
.main{margin-left:var(--sbW);padding:0;}

/* ===== Hero ===== */
.site-hero{
  position:relative;background:var(--headGrad);
  color:#fff;padding:80px 32px 70px;text-align:center;overflow:hidden;
}
.site-hero::before{
  content:"般 若";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:380px;font-weight:900;
  color:rgba(255,255,255,.035);letter-spacing:32px;
  font-family:"Noto Serif TC",serif;pointer-events:none;
}
.hero-meta{position:relative;font-family:"Noto Sans TC",sans-serif;
  font-size:13px;letter-spacing:8px;color:var(--goldL);margin-bottom:18px;opacity:.85;}
.hero-title{position:relative;font-size:56px;font-weight:900;color:#fff;
  letter-spacing:8px;margin-bottom:18px;line-height:1.25;}
.hero-subtitle{position:relative;font-size:20px;color:var(--goldL);
  letter-spacing:4px;margin-bottom:14px;font-weight:500;}
.hero-sub{position:relative;font-size:18px;color:rgba(255,255,255,.78);
  letter-spacing:3px;margin-bottom:12px;}
.hero-range{position:relative;font-size:17px;color:rgba(212,168,75,.85);
  letter-spacing:2px;margin-top:18px;font-family:"Noto Sans TC",sans-serif;
  border-top:1px solid rgba(212,168,75,.25);padding-top:18px;display:inline-block;
  max-width:88%;line-height:1.85;}

/* ===== Preface ===== */
.preface{max-width:980px;margin:54px auto 30px;padding:36px 40px;
  background:linear-gradient(135deg,#fffdf5,#f3e9d5);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.06);}
.preface h2{font-size:30px;color:var(--accent);text-align:center;
  letter-spacing:8px;margin-bottom:24px;font-weight:700;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);
  text-indent:2em;margin-bottom:14px;}
.preface p:last-child{margin-bottom:0;}

/* ===== TOC ===== */
.toc-section{max-width:1100px;margin:30px auto 50px;padding:30px 32px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;
  letter-spacing:8px;margin-bottom:14px;font-weight:700;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;
  letter-spacing:3px;margin-bottom:32px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.toc-card{display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 22px;text-decoration:none;color:inherit;
  transition:transform .25s,box-shadow .25s,border-color .25s;}
.toc-card:hover{transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(91,58,41,.12);border-color:var(--gold);}
.toc-num{flex-shrink:0;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-family:"Noto Sans TC",sans-serif;font-size:17px;font-weight:700;
  letter-spacing:1px;box-shadow:0 2px 8px rgba(184,134,11,.3);}
.toc-name{font-size:19.5px;color:var(--text);line-height:1.7;letter-spacing:1.5px;}

/* ===== Chapter ===== */
.chapter{max-width:1080px;margin:0 auto 28px;padding:0 12px;}
.ch-head{background:var(--headGrad);color:#fff;
  text-align:center;padding:40px 28px 30px;border-radius:12px 12px 0 0;}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;
  color:var(--goldL);letter-spacing:6px;margin-bottom:10px;opacity:.9;}
.ch-name{font-size:34px;font-weight:700;letter-spacing:5px;line-height:1.35;margin-bottom:10px;}
.ch-sub{font-size:17px;color:rgba(255,255,255,.72);
  letter-spacing:3px;margin-top:8px;border-top:1px solid rgba(212,168,75,.3);
  padding-top:14px;display:inline-block;}
.ch-body{background:#fffdf7;border:1px solid var(--border);border-top:0;
  border-radius:0 0 12px 12px;padding:28px 30px 30px;}

/* Bridge */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;background:var(--gold);color:#fff;
  padding:3px 12px;border-radius:12px;letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-indent:2em;}

.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

.next-link{display:inline-block;margin-top:14px;
  font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:var(--accent);text-decoration:none;letter-spacing:2px;
  border:1px solid var(--accent);padding:8px 22px;border-radius:30px;
  transition:background .25s,color .25s;}
.next-link:hover{background:var(--accent);color:#fff;}

/* Footer */
.site-footer{background:var(--sbBg);color:var(--sbText);
  text-align:center;padding:32px 20px;margin-top:40px;}
.site-footer p{font-size:15px;letter-spacing:2px;}

/* Back to top */
#backTop{position:fixed;right:24px;bottom:90px;z-index:100;
  display:none;width:44px;height:44px;border-radius:50%;
  background:var(--sbBg);color:var(--gold);border:1px solid var(--gold);
  cursor:pointer;font-size:20px;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18);}

/* ===== Mobile ===== */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:flex;}
  .main{margin-left:0;}
  .site-hero{padding:60px 18px 50px;}
  .hero-title{font-size:36px;letter-spacing:4px;}
  .hero-subtitle{font-size:16px;}
  .toc-grid{grid-template-columns:1fr;}
  .ch-name{font-size:24px;letter-spacing:2px;}
  .chapter{padding:0 6px;}
  .ch-body{padding:18px 16px;}
}
@media (max-width:600px){
  body{font-size:17px;}
  .hero-title{font-size:30px;}
  .preface{padding:24px 18px;}
}

<script>
/* ---- sidebar 卷名 click ---- */
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});}

/* ---- sidebar toggle (mobile) ---- */
var sbToggle=document.getElementById('sbToggle');
var sb=document.getElementById('sb');
if(sbToggle&&sb){sbToggle.addEventListener('click',function(){sb.classList.toggle('open');});}

/* ---- read progress ---- */
var rpFill=document.getElementById('rpFill');
var rpPct =document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill) rpFill.style.width=pct+'%';
  if(rpPct)  rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();

/* ---- read-progress 接近頁尾淡出 ---- */
(function(){
  var cap=document.getElementById('readProgress');
  if(!cap) return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var targets=[];
  var f1=document.querySelector('[data-wy-notice="v2"]');
  if(f1) targets.push(f1);
  var f2=document.querySelector('.site-footer');
  if(f2) targets.push(f2);
  if(!targets.length) return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      var any=entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  }else{
    var check=function(){
      var dh=document.documentElement.scrollHeight;
      var sb2=window.scrollY+window.innerHeight;
      setHide(dh-sb2<240);
    };
    window.addEventListener('scroll',check,{passive:true});
    check();
  }
})();

/* ---- back to top ---- */
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(backTop) backTop.style.display=window.scrollY>600?'flex':'none';
});
if(backTop) backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

/* ---- sidebar active highlight ---- */
function updateSbActive(){
  var chapters=document.querySelectorAll('.chapter');
  var th=window.innerHeight*0.35;
  var act=null;
  chapters.forEach(function(c){
    var r=c.getBoundingClientRect();
    if(r.top<th) act=c.id;
  });
  document.querySelectorAll('.sb-item').forEach(function(it){
    it.classList.toggle('active',it.getAttribute('data-ch')===act);
  });
}
window.addEventListener('scroll',updateSbActive,{passive:true});
updateSbActive();

/* ---- iframe auto height (長空白 bug 修法 · 2026/04 晚期) ---- */
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body) return;
    d.body.style.minHeight='0';
    d.body.style.height='auto';
    if(d.documentElement){
      d.documentElement.style.minHeight='0';
      d.documentElement.style.height='auto';
    }
    var h=d.body.scrollHeight;
    if(h>100){
      f.style.height=h+'px';
      f.style.minHeight='0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries<30) setTimeout(tick,200);
  }
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});

/* ---- anchor click ---- */
document.addEventListener('click',function(e){
  var a=e.target;
  while(a&&a.tagName!=='A') a=a.parentElement;
  if(!a) return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2) return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);

/* ---- 持續輪詢 15s ---- */
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50) clearInterval(_riv);},300);

/* ---- 防複製 (外層) ---- */
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12') blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-48-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
